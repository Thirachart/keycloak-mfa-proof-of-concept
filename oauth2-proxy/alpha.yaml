server:
  bindAddress: "0.0.0.0:4180"

providers:
  - id: keycloak
    provider: oidc
    name: Keycloak
    clientID: poc-app
    clientSecret: poc-app-secret
    scope: "openid profile email"
    loginURL: "http://localhost:18080/realms/poc/protocol/openid-connect/auth"
    redeemURL: "http://keycloak:8080/realms/poc/protocol/openid-connect/token"
    profileURL: "http://keycloak:8080/realms/poc/protocol/openid-connect/userinfo"
    skipClaimsFromProfileURL: true
    backendLogoutURL: "http://keycloak:8080/realms/poc/protocol/openid-connect/logout?id_token_hint={id_token}"
    oidcConfig:
      issuerURL: "http://localhost:18080/realms/poc"
      jwksURL: "http://keycloak:8080/realms/poc/protocol/openid-connect/certs"
      skipDiscovery: true
      insecureSkipIssuerVerification: true
      insecureAllowUnverifiedEmail: true
      emailClaim: email
      userIDClaim: sub
      audienceClaims: [aud]
    loginURLParameters:
      - name: kc_action
        allow:
          - value: VERIFY_EMAIL
          - value: UPDATE_EMAIL

upstreamConfig:
  upstreams:
    - id: backend
      path: /api/
      uri: http://backend:3000/
    - id: frontend
      path: /
      uri: http://frontend/

injectRequestHeaders:
  - name: Authorization
    values:
      - claimSource:
          claim: access_token
          prefix: "Bearer "
  - name: X-Forwarded-User
    values:
      - claimSource:
          claim: user
