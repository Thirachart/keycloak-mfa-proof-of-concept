  login__mfa-method-selector.ftl: |-
    <#import "verify-layout.ftl" as verify>
    <@verify.page title="เลือกวิธียืนยันตัวตน">
        <#if message?has_content && (message.type!'') == 'error'>
            <div class="poc-card-message poc-card-message-error" role="alert">
                ${message.summary?no_esc}
            </div>
        </#if>
    
        <form id="kc-mfa-method-selector-form" class="poc-card-form" action="${url.loginAction}" method="post">
            <p class="poc-verify-copy poc-card-intro">กรุณาเลือกวิธีที่ต้องการใช้ยืนยันตัวตนสำหรับการเข้าสู่ระบบครั้งนี้</p>
    
            <label class="poc-mfa-option" for="mfa-email">
                <input id="mfa-email" type="radio" name="mfa_method" value="email" checked />
                <span>
                    <strong>รหัส OTP ทางอีเมล</strong>
                    <small>ส่งรหัสใช้ครั้งเดียวไปยังอีเมลที่ยืนยันแล้วของคุณ</small>
                </span>
            </label>
    
            <div class="poc-mfa-option poc-mfa-disabled" aria-disabled="true">
                <input type="radio" disabled />
                <span>
                    <strong>แอปยืนยันตัวตน</strong>
                    <small>ยังไม่เปิดใช้งานใน PoC นี้</small>
                </span>
            </div>
    
            <div class="poc-mfa-option poc-mfa-disabled" aria-disabled="true">
                <input type="radio" disabled />
                <span>
                    <strong>พาสคีย์ / WebAuthn</strong>
                    <small>ยังไม่เปิดใช้งานใน PoC นี้</small>
                </span>
            </div>
    
            <div class="poc-verify-actions poc-card-actions">
                <button class="poc-verify-button poc-verify-button-primary" type="submit">${msg("doContinue")}</button>
            </div>
        </form>
    </@verify.page>
  login__resources__css__pattaya-login.css: |-
    /* Import Font ภาษาไทย */
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap');
    
    body, html { height: 100%; margin: 0; font-family: 'Sarabun', sans-serif; }
    .login-container { display: flex; height: 100vh; width: 100vw; }
    
    /* Left panel aligned with the production PFAS theme across all PATTAYA browser pages. */
    .login-left-panel {
        flex: 5;
        background-color: #ffffff;
        background-image: url('../img/login-img.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    
    /* Right Panel */
    .login-right-panel { flex: 5; background-color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .login-form-wrapper { width: 100%; max-width: 450px; }
    
    /* Headers */
    .system-title-en { color: #f60; font-size: 2rem; font-weight: normal; margin: 0; line-height: 1.2; }
    .system-title-th { color: #000; font-size: 20px; margin-top: 10px; margin-bottom: 30px; font-weight: normal; }
    
    /* Alert Box */
    .alert-box {
        background-color: #ffebee; color: #c62828; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ef9a9a; font-size: 14px;
    }
    
    /* Form Elements */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; margin-bottom: 8px; color: #37474f; font-weight: bold; font-size: 14px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #cfd8dc; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.2s; }
    .form-control:focus { outline: none; border-color: #e65100; box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.1); }
    .password-wrapper { position: relative; }
    .password-wrapper .form-control { padding-right: 44px; }
    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #90a4ae; font-size: 16px; padding: 0; line-height: 1; }
    .toggle-password:hover { color: #546e7a; }
    
    /* Remember Me & Forgot Password */
    .form-options-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 14px; color: #546e7a; }
    .checkbox-item label { display: flex; align-items: center; cursor: pointer; }
    .checkbox-item input { margin-right: 8px; width: 16px; height: 16px; accent-color: #e65100; }
    .forgot-link a, .register-link a { color: #e65100; text-decoration: none; font-weight: 600; }
    .forgot-link a:hover, .register-link a:hover { text-decoration: underline; }
    
    /* Update Password Title */
    .update-password-title { font-size: 18px; font-weight: 600; color: #37474f; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid #f5f5f5; }
    
    /* Login Button */
    .btn-primary { width: 100%; padding: 10px; background-color: #e65100; color: white; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(230, 81, 0, 0.2); }
    .btn-primary:hover { background-color: #bf360c; transform: translateY(-1px); }
    .btn-cancel { width: 100%; padding: 10px; background-color: #ffffff; color: #546e7a; border: 1px solid #cfd8dc; border-radius: 30px; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 4px; }
    .btn-cancel:hover { background-color: #f5f5f5; border-color: #b0bec5; }
    
    /* Separator */
    .separator { display: flex; align-items: center; text-align: center; margin: 30px 0 20px 0; color: #90a4ae; font-size: 14px; }
    .separator::before, .separator::after { content: ''; flex: 1; border-bottom: 1px solid #cfd8dc; }
    .separator span { padding: 0 10px; }
    
    /* Social Login Buttons */
    .social-login-list { display: flex; flex-direction: column; gap: 10px; }
    .btn-social {
        width: 100%; padding: 12px; background-color: #ffffff; color: #37474f;
        border: 1px solid #cfd8dc; border-radius: 8px; font-size: 16px; font-weight: 600;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        text-decoration: none; transition: 0.2s;
        box-sizing: border-box;
    }
    .btn-social:hover { background-color: #f5f5f5; border-color: #b0bec5; }
    .btn-social img { height: 24px; margin-right: 10px; }
    
    /* Register Link */
    .register-link { margin-top: 24px; text-align: center; font-size: 14px; color: #546e7a; }
    
    /* MFA method selector */
    .mfa-intro { margin: 0 0 20px; color: #546e7a; font-size: 14px; }
    .mfa-option { display: flex; gap: 12px; align-items: flex-start; border: 1px solid #cfd8dc; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; background: #fff; transition: 0.2s; }
    .mfa-option:hover { border-color: #e65100; }
    .mfa-option input { margin-top: 3px; accent-color: #e65100; }
    .mfa-option strong { display: block; color: #37474f; font-size: 15px; }
    .mfa-option small { display: block; margin-top: 4px; color: #90a4ae; line-height: 1.4; }
    .mfa-option-disabled { opacity: .5; cursor: not-allowed; background: #f5f5f5; }
    .mfa-actions { margin-top: 20px; }
    
    /* Email OTP entry */
    .otp-hint { margin: 0 0 20px; color: #546e7a; font-size: 14px; line-height: 1.6; }
    .otp-hint strong { color: #37474f; }
    .otp-input { letter-spacing: 6px; font-size: 22px; text-align: center; }
    .otp-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    
    /* Shared PATTAYA shell for pages inherited from Keycloak v2. */
    .pattaya-inherited-page .pattaya-flow-section {
        width: 100%;
    }
    
