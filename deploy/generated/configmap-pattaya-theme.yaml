        flex-direction: column;
      }
    
      .poc-verify-button {
        width: 100%;
      }
    }
  login__template.ftl: |-
    <#import "field.ftl" as field>
    <#import "footer.ftl" as loginFooter>
    
    <#macro username>
      <#assign label>
        <#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if>
      </#assign>
      <@field.group name="username" label=label>
        <div class="${properties.kcInputGroup}">
          <div class="${properties.kcInputGroupItemClass} ${properties.kcFill}">
            <span class="${properties.kcInputClass} ${properties.kcFormReadOnlyClass}">
              <input id="kc-attempted-username" value="${auth.attemptedUsername}" readonly>
            </span>
          </div>
          <div class="${properties.kcInputGroupItemClass}">
            <button id="reset-login" class="${properties.kcFormPasswordVisibilityButtonClass} kc-login-tooltip" type="button"
                    aria-label="${msg('restartLoginTooltip')}" onclick="location.href='${url.loginRestartFlowUrl}'">
              <i class="fa-sync-alt fas" aria-hidden="true"></i>
              <span class="kc-tooltip-text">${msg("restartLoginTooltip")}</span>
            </button>
          </div>
        </div>
      </@field.group>
    </#macro>
    
    <#macro registrationLayout bodyClass="" displayInfo=false displayMessage=true displayRequiredFields=false>
    <!DOCTYPE html>
    <html class="${properties.kcHtmlClass!}" lang="${lang!"th"}"<#if realm.internationalizationEnabled> dir="${(locale.rtl)?then('rtl','ltr')}"</#if>>
    <head>
      <meta charset="utf-8">
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta name="color-scheme" content="light">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <#if properties.meta?has_content>
        <#list properties.meta?split(' ') as meta>
          <meta name="${meta?split('==')[0]}" content="${meta?split('==')[1]}"/>
        </#list>
      </#if>
      <title>${title!msg("loginTitle",(realm.displayName!''))}</title>
      <link rel="icon" type="image/x-icon" href="${url.resourcesPath}/img/newlogo.png"/>
      <#if properties.stylesCommon?has_content>
        <#list properties.stylesCommon?split(' ') as style>
          <link href="${url.resourcesCommonPath}/${style}" rel="stylesheet" />
        </#list>
      </#if>
      <#if properties.styles?has_content>
        <#list properties.styles?split(' ') as style>
          <link href="${url.resourcesPath}/${style}" rel="stylesheet" />
        </#list>
      </#if>
      <script type="importmap">
        {
          "imports": {
            "rfc4648": "${url.resourcesCommonPath}/vendor/rfc4648/rfc4648.js"
          }
        }
      </script>
      <#if properties.scripts?has_content>
        <#list properties.scripts?split(' ') as script>
          <script src="${url.resourcesPath}/${script}" type="text/javascript"></script>
        </#list>
      </#if>
      <#if scripts??>
        <#list scripts as script>
          <script src="${script}" type="text/javascript"></script>
        </#list>
      </#if>
      <script type="module" src="${url.resourcesPath}/js/passwordVisibility.js"></script>
      <script type="module">
        <#outputformat "JavaScript">
        import { startSessionPolling } from ${(url.resourcesPath + "/js/authChecker.js")?c};
        startSessionPolling(${url.ssoLoginInOtherTabsUrl?c});
        </#outputformat>
      </script>
      <script type="module">
        document.addEventListener("click", (event) => {
          const link = event.target.closest("a[data-once-link]");
          if (!link) return;
          if (link.getAttribute("aria-disabled") === "true") {
            event.preventDefault();
            return;
          }
          const { disabledClass } = link.dataset;
          if (disabledClass) link.classList.add(...disabledClass.trim().split(/\s+/));
          link.setAttribute("role", "link");
          link.setAttribute("aria-disabled", "true");
        });
      </script>
      <#if authenticationSession??>
        <script type="module">
          <#outputformat "JavaScript">
          import { checkAuthSession } from ${(url.resourcesPath + "/js/authChecker.js")?c};
          checkAuthSession(${authenticationSession.authSessionIdHash?c});
          </#outputformat>
        </script>
      </#if>
      <script>
        // Preserve the parent Keycloak template compatibility workaround.
        const isFirefox = true;
      </script>
    </head>
    <body id="keycloak-bg" class="${properties.kcBodyClass!} pattaya-inherited-page poc-verify-body ${bodyClass}" data-page-id="login-${pageId}">
      <main class="poc-verify-card poc-inherited-card" role="main">
        <div class="poc-verify-brand">
          <img class="poc-verify-logo" src="${url.resourcesPath}/img/newlogo.png" alt="PFAS" width="40" height="40" />
          <div class="poc-verify-brand-copy">
            <div class="poc-verify-brand-name">PFAS</div>
            <div class="poc-verify-brand-subtitle">ระบบการเงินและบัญชีเมืองพัทยา</div>
          </div>
        </div>
        <div class="poc-verify-divider"></div>
    
        <section class="pattaya-flow-section" role="main">
          <div class="pattaya-flow-heading-row">
            <h1 class="poc-verify-title pattaya-flow-title" id="kc-page-title"><#nested "header"></h1>
            <#if realm.internationalizationEnabled && locale.supported?size gt 1>
              <select class="pattaya-language-select" aria-label="${msg("languages")}" id="login-select-toggle"
                      onchange="if (this.value) window.location.href=this.value">
                <#list locale.supported?sort_by("label") as l>
                  <option value="${l.url}" ${(l.languageTag == locale.currentLanguageTag)?then('selected','')}>${l.label}</option>
                </#list>
              </select>
            </#if>
          </div>
    
          <#if !(auth?has_content && auth.showUsername() && !auth.showResetCredentials())>
            <#if displayRequiredFields>
              <p class="pattaya-required-fields"><span aria-hidden="true">*</span> ${msg("requiredFields")}</p>
            </#if>
          <#else>
            <#if displayRequiredFields>
              <p class="pattaya-required-fields"><span aria-hidden="true">*</span> ${msg("requiredFields")}</p>
            </#if>
            <div class="pattaya-inherited-form pattaya-shown-username">
              <#nested "show-username">
              <@username />
            </div>
          </#if>
    
          <#if displayMessage && message?has_content && (message.type != 'warning' || !isAppInitiatedAction??)>
            <div class="poc-card-message poc-card-message-${message.type!'info'}" role="alert">
              <span class="kc-feedback-text">${message.summary}</span>
            </div>
          </#if>
    
          <div class="pattaya-inherited-form">
            <#nested "form">
          </div>
    
          <#if auth?has_content && auth.showTryAnotherWayLink()>
            <form id="kc-select-try-another-way-form" class="pattaya-inherited-form" action="${url.loginAction}" method="post" novalidate="novalidate">
              <input type="hidden" name="tryAnotherWay" value="on"/>
              <a id="try-another-way" href="javascript:document.forms['kc-select-try-another-way-form'].requestSubmit()" class="poc-verify-button poc-verify-button-secondary pattaya-action-link">
                ${msg("doTryAnotherWay")}
              </a>
            </form>
          </#if>
    
          <div class="pattaya-social-providers">
            <#nested "socialProviders">
          </div>
    
          <#if displayInfo>
            <div id="kc-info" class="pattaya-flow-info">
              <#nested "info">
            </div>
          </#if>
    
          <div class="pattaya-keycloak-footer">
            <@loginFooter.content/>
          </div>
        </section>
    
        <div class="poc-verify-divider poc-verify-divider-footer"></div>
        <p class="poc-verify-note">หากท่านไม่ได้เป็นผู้ทำรายการนี้ กรุณาเพิกเฉยและไม่ต้องดำเนินการใด ๆ เพิ่มเติม</p>
      </main>
      <footer class="poc-verify-footer">&copy; เมืองพัทยา &middot; ระบบการเงินและบัญชีเมืองพัทยา (PFAS)</footer>
    </body>
    </html>
    </#macro>
    
    <#macro simplePage title>
      <@registrationLayout displayMessage=false; section>
        <#if section = "header">
          ${title}
        <#elseif section = "form">
          <#nested>
        </#if>
      </@registrationLayout>
    </#macro>
  login__theme.properties: |-
    parent=keycloak.v2
    styles=css/poc.css css/pattaya-login.css
  login__update-email.ftl: |-
    <#import "verify-layout.ftl" as verify>
    <#import "user-profile-commons.ftl" as userProfileCommons>
    <@verify.page title="เปลี่ยนอีเมล">
        <p class="poc-verify-copy">
            ระบุอีเมลใหม่ที่ต้องการใช้งาน ระบบจะส่งลิงก์ยืนยันไปยังอีเมลใหม่ก่อนเปลี่ยนข้อมูลในบัญชี
        </p>
    
        <#if message?has_content>
            <div class="poc-update-email-message poc-update-email-message-${message.type!"info"}" role="alert">
                ${kcSanitize(message.summary)?no_esc}
            </div>
        </#if>
    
        <form id="kc-update-email-form" class="poc-update-email-form" action="${url.loginAction}" method="post">
            <@userProfileCommons.userProfileFormFields/>
    
            <div class="poc-verify-actions poc-update-email-actions">
                <button id="poc-update-email-submit" class="poc-verify-button poc-verify-button-primary" type="submit">
                    บันทึกและส่งอีเมลยืนยัน
                </button>
                <#if isAppInitiatedAction??>
                    <button id="poc-update-email-cancel" class="poc-verify-button poc-verify-button-secondary" type="submit" name="cancel-aia" value="true" formnovalidate>
                        ยกเลิก
                    </button>
                </#if>
            </div>
        </form>
    </@verify.page>
  login__verify-layout.ftl: |-
    <#macro page title>
    <!DOCTYPE html>
    <html lang="${lang!"th"}">
    <head>
      <meta charset="utf-8">
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="color-scheme" content="light">
      <title>${title}</title>
      <link rel="icon" type="image/x-icon" href="${url.resourcesPath}/img/newlogo.png"/>
      <link rel="stylesheet" href="${url.resourcesPath}/css/poc.css" />
    </head>
    <body class="poc-verify-body">
      <main class="poc-verify-card" role="main">
        <div class="poc-verify-brand">
          <img class="poc-verify-logo" src="${url.resourcesPath}/img/newlogo.png" alt="PFAS" width="40" height="40" />
          <div class="poc-verify-brand-copy">
            <div class="poc-verify-brand-name">PFAS</div>
            <div class="poc-verify-brand-subtitle">ระบบการเงินและบัญชีเมืองพัทยา</div>
          </div>
        </div>
        <div class="poc-verify-divider"></div>
        <h1 class="poc-verify-title">${title}</h1>
        <#nested>
        <div class="poc-verify-divider poc-verify-divider-footer"></div>
        <p class="poc-verify-note">หากท่านไม่ได้เป็นผู้ทำรายการนี้ กรุณาเพิกเฉยและไม่ต้องดำเนินการใด ๆ เพิ่มเติม</p>
      </main>
      <footer class="poc-verify-footer">&copy; เมืองพัทยา &middot; ระบบการเงินและบัญชีเมืองพัทยา (PFAS)</footer>
    </body>
    </html>
    </#macro>
