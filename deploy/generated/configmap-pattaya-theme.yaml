    ${link}
    
    ลิงก์นี้จะหมดอายุภายใน ${linkExpirationFormatter(linkExpiration)}
    
    หากท่านไม่ได้เป็นผู้ทำรายการนี้ กรุณาเพิกเฉยต่ออีเมลฉบับนี้ ท่านไม่จำเป็นต้องดำเนินการใดๆ เพิ่มเติม
    
    © เมืองพัทยา · ระบบการเงินและบัญชีเมืองพัทยา (PFAS)
  email__text__password-reset.ftl: |-
    <#ftl output_format="plainText">
    <#assign displayName = user.username>
    <#if user.firstName?? && user.firstName?has_content>
      <#assign displayName = user.firstName>
    </#if>
    ตั้งรหัสผ่านใหม่
    
    เรียน คุณ${displayName}
    
    เราได้รับคำขอให้ตั้งรหัสผ่านใหม่สำหรับบัญชีระบบการเงินและบัญชีเมืองพัทยา (PFAS) ของท่าน กรุณาเปิดลิงก์ด้านล่างเพื่อกำหนดรหัสผ่านใหม่
    
    ${link}
    
    ลิงก์นี้จะหมดอายุภายใน ${linkExpirationFormatter(linkExpiration)}
    
    หากท่านไม่ได้เป็นผู้ขอตั้งรหัสผ่านใหม่ กรุณาเพิกเฉยต่ออีเมลฉบับนี้ รหัสผ่านเดิมของท่านจะยังคงใช้งานได้จนกว่าจะมีการตั้งรหัสผ่านใหม่สำเร็จ
    
    © เมืองพัทยา · ระบบการเงินและบัญชีเมืองพัทยา (PFAS)
  email__theme.properties: |-
    parent=keycloak
  login__app-links.ftl: |-
    <#-- Builds oauth2-proxy "start" links from the client's Home URL (Keycloak Admin > Clients > Home URL)
         instead of a hardcoded per-environment domain, so changing environments only means updating
         that one Keycloak setting — never the theme ConfigMap. There is deliberately no hardcoded
         domain fallback here: callers must check (client.baseUrl)?has_content themselves and skip
         rendering the link/button when it's empty. -->
    
    <#function appBaseUrlNoTrailingSlash>
        <#if client.baseUrl?ends_with("/")>
            <#return client.baseUrl[0..<client.baseUrl?length - 1]>
        <#else>
            <#return client.baseUrl>
        </#if>
    </#function>
    
    <#function appLoginUrl>
        <#if (client.baseUrl)?has_content>
            <#local base = appBaseUrlNoTrailingSlash()>
            <#return base + "/oauth2/start?rd=" + (base + "/")?url("UTF-8")>
        <#else>
            <#return "">
        </#if>
    </#function>
    
    <#function appUpdateEmailUrl>
        <#if (client.baseUrl)?has_content>
            <#local base = appBaseUrlNoTrailingSlash()>
            <#return base + "/oauth2/start?rd=" + (base + "/")?url("UTF-8") + "&kc_action=UPDATE_EMAIL">
        <#else>
            <#return "">
        </#if>
    </#function>
  login__email-code-form.ftl: |-
    <#import "verify-layout.ftl" as verify>
    <#assign otpLength = (codeLength!6)>
    <@verify.page title="ยืนยันรหัส OTP">
        <#if messagesPerField.existsError('emailCode')>
            <div class="poc-card-message poc-card-message-error" role="alert">
                ${kcSanitize(messagesPerField.get('emailCode'))?no_esc}
            </div>
        <#elseif message?has_content && (message.type!'') == 'error'>
            <div class="poc-card-message poc-card-message-error" role="alert">
                ${message.summary?no_esc}
            </div>
        </#if>
    
        <form id="kc-otp-login-form" class="poc-card-form" action="${url.loginAction}" method="post">
            <p class="poc-verify-copy poc-card-intro">
                ${msg("emailOtpForm", otpLength)}<#if maskedEmail??><br/><strong>${kcSanitize(maskedEmail)?no_esc}</strong></#if>
            </p>
    
            <div class="poc-card-field">
                <input id="emailCode" name="emailCode" autocomplete="off" type="text" class="poc-card-control poc-otp-input"
                       autofocus maxlength="${otpLength?c}"
                       aria-label="รหัส OTP"
                       aria-invalid="<#if messagesPerField.existsError('emailCode')>true</#if>"
                       <#if maxAttemptsReached?? && maxAttemptsReached>disabled</#if> />
            </div>
    
            <div class="poc-verify-actions poc-card-actions poc-card-actions-stacked">
                <#if !(maxAttemptsReached?? && maxAttemptsReached)>
                    <button class="poc-verify-button poc-verify-button-primary" name="login" type="submit">${msg("doLogIn")}</button>
                </#if>
                <button class="poc-verify-button poc-verify-button-secondary" name="resend" type="submit">${msg("resendCode")}</button>
                <button class="poc-verify-button poc-verify-button-secondary" name="cancel" type="submit">${msg("doCancel")}</button>
            </div>
        </form>
    </@verify.page>
  login__error.ftl: |-
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>${msg("error")}</title>
        <link rel="icon" type="image/x-icon" href="${url.resourcesPath}/img/newlogo.png"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { font-family: 'Sarabun', sans-serif; background: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
            .error-wrap { text-align: center; padding: 40px 24px; max-width: 480px; }
            .error-icon { font-size: 120px; font-weight: 700; color: #263238; line-height: 1; }
            .error-msg { font-size: 30px; font-weight: 700; color: #263238; margin: 16px 0 8px; }
            .error-summary { font-size: 15px; color: #90a4ae; margin: 0 0 12px; line-height: 1.6; }
            .error-detail { font-size: 16px; color: #546e7a; margin-bottom: 36px; line-height: 1.6; }
            .btn-home { display: inline-block; padding: 12px 36px; background: #263238; color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; border-radius: 6px; transition: background 0.2s; }
            .btn-home:hover { background: #e65100; }
        </style>
    </head>
    <body>
      <div class="error-wrap">
          <div class="error-icon">
              <#if message?has_content && (message.type!'') == 'error'>
                  <i class="fa fa-exclamation-triangle" style="font-size:100px;color:#c62828;"></i>
              <#elseif message?has_content && (message.type!'') == 'warning'>
                  <i class="fa fa-exclamation-circle" style="font-size:100px;color:#e65100;"></i>
              <#else>
                  <i class="fa fa-exclamation-circle" style="font-size:100px;color:#90a4ae;"></i>
              </#if>
          </div>
          <div class="error-msg">เกิดข้อผิดพลาด</div>
          <#if message?has_content>
              <div class="error-summary">${message.summary?no_esc}</div>
          </#if>
          <div class="error-detail">ระบบไม่สามารถดำเนินการได้<br/>กรุณาลองอีกครั้งหรือติดต่อผู้ดูแลระบบ</div>
          <#if client?? && client.baseUrl?has_content>
              <a href="${client.baseUrl}" class="btn-home">${msg("doBack")}</a>
          <#else>
              <a href="${url.loginUrl!'/'}" class="btn-home">${msg("doLogIn")}</a>
          </#if>
      </div>
    </body>
    </html>
  login__info.ftl: |-
    <#import "app-links.ftl" as app>
    <#assign isVerifyEmailInfo = messageHeader?? && (messageHeader == "confirmEmailAddressVerificationHeader" || messageHeader == msg("confirmEmailAddressVerificationHeader"))>
    <#assign isEmailVerifiedDone = messageHeader?? && (messageHeader == "emailVerifiedMessageHeader" || messageHeader == "emailVerifiedAlreadyMessageHeader" || messageHeader == msg("emailVerifiedMessageHeader") || messageHeader == msg("emailVerifiedAlreadyMessageHeader"))>
    <#assign isEmailUpdateSent = messageHeader?? && (messageHeader == "emailUpdateConfirmationSentTitle" || messageHeader == msg("emailUpdateConfirmationSentTitle"))>
    <#assign isEmailUpdated = messageHeader?? && (messageHeader == "emailUpdatedTitle" || messageHeader == msg("emailUpdatedTitle"))>
    <#assign isAccountUpdated = messageHeader?? && (messageHeader == "accountUpdatedTitle" || messageHeader == msg("accountUpdatedTitle"))>
    <#assign isPasswordUpdated = isAccountUpdated && message?has_content && (message.summary == msg("accountPasswordUpdatedMessage"))>
    <#assign isPasswordResetCompleted = isPasswordUpdated && !(pageRedirectUri?has_content) && !(actionUri?has_content)>
    
    <#if isVerifyEmailInfo>
        <#import "verify-layout.ftl" as verify>
        <@verify.page title="ยืนยันอีเมลของคุณ">
            <p class="poc-verify-copy">
                กรุณากดปุ่มด้านล่างเพื่อยืนยันความเป็นเจ้าของอีเมลนี้ และดำเนินการยืนยันอีเมลให้เสร็จสมบูรณ์
            </p>
    
            <#if actionUri?has_content>
                <div class="poc-verify-actions">
                    <a id="poc-verify-proceed" class="poc-verify-button poc-verify-button-primary" href="${actionUri}" data-once-link>
                        ยืนยันอีเมล
                    </a>
                    <#if (client.baseUrl)?has_content>
                        <a id="poc-change-email" class="poc-verify-button poc-verify-button-secondary" href="${app.appUpdateEmailUrl()}">
                            เปลี่ยนอีเมล
                        </a>
                    </#if>
                </div>
            <#elseif pageRedirectUri?has_content>
                <div class="poc-verify-actions">
                    <a class="poc-verify-button poc-verify-button-primary" href="${pageRedirectUri}">
                        กลับไปยังระบบ
                    </a>
                </div>
            </#if>
        </@verify.page>
    <#elseif isEmailVerifiedDone>
        <#import "verify-layout.ftl" as verify>
        <@verify.page title="ยืนยันอีเมลสำเร็จ">
            <p id="poc-email-verified-message" class="poc-verify-copy">
                ${message.summary}
            </p>
            <div class="poc-verify-actions">
                <#if pageRedirectUri?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${pageRedirectUri}">กลับไปยังระบบ</a>
                <#elseif actionUri?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${actionUri}">ดำเนินการต่อ</a>
                <#elseif (client.baseUrl)?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${client.baseUrl}">กลับไปยังระบบ</a>
                </#if>
            </div>
        </@verify.page>
    <#elseif isEmailUpdateSent>
        <#import "verify-layout.ftl" as verify>
        <@verify.page title="${msg('emailUpdateConfirmationSentTitle')}">
            <p id="poc-email-update-message" class="poc-verify-copy">
                ${message.summary}
            </p>
            <p class="poc-verify-copy poc-verify-copy-secondary">
                กรุณาเปิดอีเมลใหม่และกดลิงก์ยืนยันเพื่อให้การเปลี่ยนอีเมลเสร็จสมบูรณ์
            </p>
            <div class="poc-verify-actions">
                <#if (client.baseUrl)?has_content>
                    <a id="poc-change-email-again" class="poc-verify-button poc-verify-button-secondary" href="${app.appUpdateEmailUrl()}">
                        เปลี่ยนอีเมลอีกครั้ง
                    </a>
                </#if>
                <#if pageRedirectUri?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${pageRedirectUri}">กลับไปยังระบบ</a>
                <#elseif actionUri?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${actionUri}">ดำเนินการต่อ</a>
                <#elseif (client.baseUrl)?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${client.baseUrl}">กลับไปยังระบบ</a>
                </#if>
            </div>
        </@verify.page>
    <#elseif isEmailUpdated>
        <#import "verify-layout.ftl" as verify>
        <@verify.page title="${msg('emailUpdatedTitle')}">
            <p id="poc-email-updated-message" class="poc-verify-copy">
                ${message.summary}
            </p>
            <div class="poc-verify-actions">
                <#if pageRedirectUri?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${pageRedirectUri}">กลับไปยังระบบ</a>
                <#elseif actionUri?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${actionUri}">ดำเนินการต่อ</a>
                <#elseif (client.baseUrl)?has_content>
                    <a class="poc-verify-button poc-verify-button-primary" href="${client.baseUrl}">กลับไปยังระบบ</a>
                </#if>
            </div>
        </@verify.page>
    <#elseif isPasswordResetCompleted>
        <#import "verify-layout.ftl" as verify>
        <@verify.page title="เปลี่ยนรหัสผ่านสำเร็จ">
            <p id="poc-password-updated-message" class="poc-verify-copy">
                รหัสผ่านของคุณได้รับการเปลี่ยนเรียบร้อยแล้ว กรุณาเข้าสู่ระบบอีกครั้งด้วยรหัสผ่านใหม่
            </p>
            <div class="poc-verify-actions">
                <#if (client.baseUrl)?has_content>
                    <a id="poc-password-login" class="poc-verify-button poc-verify-button-primary" href="${app.appLoginUrl()}">
                        เข้าสู่ระบบด้วยรหัสผ่านใหม่
                    </a>
                </#if>
            </div>
        </@verify.page>
    <#elseif isPasswordUpdated>
        <#import "verify-layout.ftl" as verify>
        <@verify.page title="เปลี่ยนรหัสผ่านสำเร็จ">
            <p id="poc-password-updated-message" class="poc-verify-copy">
                ${message.summary}
            </p>
            <div class="poc-verify-actions">
                <#if pageRedirectUri?has_content>
                    <a id="poc-password-return" class="poc-verify-button poc-verify-button-primary" href="${pageRedirectUri}">กลับไปยังระบบ</a>
                <#elseif actionUri?has_content>
                    <a id="poc-password-continue" class="poc-verify-button poc-verify-button-primary" href="${actionUri}">ดำเนินการต่อ</a>
                <#elseif (client.baseUrl)?has_content>
                    <a id="poc-password-return" class="poc-verify-button poc-verify-button-primary" href="${client.baseUrl}">กลับไปยังระบบ</a>
                </#if>
            </div>
        </@verify.page>
    <#elseif isAccountUpdated>
        <#import "verify-layout.ftl" as verify>
        <@verify.page title="${msg('accountUpdatedTitle')}">
            <p id="poc-account-updated-message" class="poc-verify-copy">
                ${message.summary}
            </p>
            <div class="poc-verify-actions">
                <#if pageRedirectUri?has_content>
                    <a id="poc-account-return" class="poc-verify-button poc-verify-button-primary" href="${pageRedirectUri}">กลับไปยังระบบ</a>
                <#elseif actionUri?has_content>
                    <a id="poc-account-continue" class="poc-verify-button poc-verify-button-primary" href="${actionUri}">ดำเนินการต่อ</a>
                <#elseif (client.baseUrl)?has_content>
                    <a id="poc-account-return" class="poc-verify-button poc-verify-button-primary" href="${client.baseUrl}">กลับไปยังระบบ</a>
                </#if>
            </div>
        </@verify.page>
    <#else>
        <#import "template.ftl" as layout>
        <@layout.registrationLayout displayMessage=false; section>
            <#if section = "header">
                <#if messageHeader??>
                    ${kcSanitize(msg("${messageHeader}"))?no_esc}
                <#else>
                    ${message.summary}
                </#if>
            <#elseif section = "form">
                <div id="kc-info-message">
                    <p class="instruction">${message.summary}<#if requiredActions??><#list requiredActions>: <b><#items as reqActionItem>${kcSanitize(msg("requiredAction.${reqActionItem}"))?no_esc}<#sep>, </#items></b></#list></#if></p>
                    <#if !skipLink??>
                        <#if pageRedirectUri?has_content>
                            <p><a href="${pageRedirectUri}">${msg("backToApplication")}</a></p>
                        <#elseif actionUri?has_content>
                            <p><a href="${actionUri}">${msg("proceedWithAction")}</a></p>
                        <#elseif (client.baseUrl)?has_content>
                            <p><a href="${client.baseUrl}">${msg("backToApplication")}</a></p>
                        </#if>
                    </#if>
                </div>
            </#if>
        </@layout.registrationLayout>
    </#if>
  login__login.ftl: |-
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>${msg("loginTitle",(realm.displayName!''))}</title>
        <link href="${url.resourcesPath}/css/pattaya-login.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="${url.resourcesPath}/img/newlogo.png"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
      <div class="login-container">
    
        <div class="login-left-panel" aria-hidden="true"></div>
    
        <div class="login-right-panel">
            <div class="login-form-wrapper">
    
                <div class="login-header">
                    <h1 class="system-title-en">PATTAYA FINANCIAL AND ACCOUNTING SYSTEM</h1>
                    <h2 class="system-title-th">ระบบการเงินและบัญชีเมืองพัทยา</h2>
                </div>
    
                <#if message?has_content && (message.type!'') == 'error'>
                    <div class="alert-box">
                        ${message.summary?no_esc}
                    </div>
                </#if>
    
                <#if realm.password>
                    <form id="kc-form-login" onsubmit="login.disabled = true; return true;" action="${url.loginAction}" method="post">
    
                        <div class="form-group">
                            <label for="username" class="form-label">
                                <#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if>
                            </label>
                            <input id="username" class="form-control" name="username" value="${(login.username)!''}" type="text" autofocus autocomplete="off" />
                        </div>
    
                        <div class="form-group">
                            <label for="password" class="form-label">${msg("password")}</label>
                            <div class="password-wrapper">
                                <input id="password" class="form-control" name="password" type="password" autocomplete="off" />
                                <button type="button" class="toggle-password" onclick="togglePassword()" tabindex="-1" aria-label="แสดง/ซ่อนรหัสผ่าน">
                                    <i id="toggle-icon" class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>
    
                        <div class="form-options-group">
                            <#-- Remember Me and Forgot Password are hidden for now — see docs/design-decisions.md #9.
                            <#if realm.rememberMe && !usernameHidden??>
                                <div class="checkbox-item">
                                    <label>
                                        <#if login.rememberMe??>
                                            <input id="rememberMe" name="rememberMe" type="checkbox" checked> ${msg("rememberMe")}
                                        <#else>
                                            <input id="rememberMe" name="rememberMe" type="checkbox"> ${msg("rememberMe")}
                                        </#if>
                                    </label>
                                </div>
                            </#if>
    
                            <#if realm.resetPasswordAllowed>
                                <div class="forgot-link">
                                    <a href="${url.loginResetCredentialsUrl}">${msg("doForgotPassword")}</a>
                                </div>
                            </#if>
                            -->
                        </div>
    
                        <div class="form-group">
                            <button class="btn-primary" name="login" id="kc-login" type="submit">
                                ${msg("doLogIn")}
                            </button>
                        </div>
                    </form>
                </#if>
    
                <#if realm.password && social?? && social.providers?has_content>
                    <div class="separator">
                        <span>หรือเข้าสู่ระบบด้วย</span>
                    </div>
    
                    <div class="social-login-list">
                        <#list social.providers as p>
                            <a href="${p.loginUrl}" id="social-${p.alias}" class="btn-social">
                                <i class="fa fa-sign-in" aria-hidden="true" style="margin-right:8px;"></i>
                                <span>${p.displayName!}</span>
                            </a>
                        </#list>
                    </div>
                </#if>
    
                <#if realm.password && realm.registrationAllowed && !registrationDisabled??>
                    <div class="register-link">
                        <span>${msg("noAccount")} <a href="${url.registrationUrl}">${msg("doRegister")}</a></span>
                    </div>
                </#if>
    
            </div>
        </div>
      </div>
      <script>
        function togglePassword() {
          var input = document.getElementById('password');
          var icon = document.getElementById('toggle-icon');
          if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
          } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
          }
        }
      </script>
    </body>
    </html>
  login__login-update-password.ftl: |-
    <#import "verify-layout.ftl" as verify>
    <@verify.page title="${msg('updatePasswordTitle')}">
        <#if message?has_content && (message.type!'') == 'error'>
            <div class="poc-card-message poc-card-message-error" role="alert">
                ${message.summary?no_esc}
            </div>
        </#if>
    
        <form id="kc-passwd-update-form" class="poc-card-form" action="${url.loginAction}" method="post">
            <input type="text" id="username" name="username" value="${username!''}" autocomplete="username" readonly style="display:none;" />
    
            <div class="poc-card-field">
                <label for="password-new">${msg("passwordNew")}</label>
                <div class="poc-password-wrapper">
                    <input id="password-new" class="poc-card-control" name="password-new" type="password" autofocus autocomplete="new-password" />
                    <button type="button" class="poc-password-toggle" onclick="togglePassword('password-new','toggle-new')" aria-label="แสดงหรือซ่อนรหัสผ่านใหม่">
                        <span id="toggle-new">แสดง</span>
                    </button>
                </div>
            </div>
    
            <div class="poc-card-field">
                <label for="password-confirm">${msg("passwordConfirmNew")}</label>
                <div class="poc-password-wrapper">
                    <input id="password-confirm" class="poc-card-control" name="password-confirm" type="password" autocomplete="new-password" />
                    <button type="button" class="poc-password-toggle" onclick="togglePassword('password-confirm','toggle-confirm')" aria-label="แสดงหรือซ่อนยืนยันรหัสผ่าน">
                        <span id="toggle-confirm">แสดง</span>
                    </button>
                </div>
            </div>
    
            <div class="poc-verify-actions poc-card-actions poc-card-actions-stacked">
                <button class="poc-verify-button poc-verify-button-primary" type="submit">
                    ${msg("doSubmit")}
                </button>
                <#if isAppInitiatedAction??>
                    <button class="poc-verify-button poc-verify-button-secondary" type="submit" name="cancel-aia" value="true">
                        ${msg("doCancel")}
                    </button>
                </#if>
            </div>
        </form>
    
        <script>
          function togglePassword(inputId, labelId) {
            var input = document.getElementById(inputId);
            var label = document.getElementById(labelId);
            if (input.type === 'password') {
              input.type = 'text';
              label.textContent = 'ซ่อน';
            } else {
              input.type = 'password';
              label.textContent = 'แสดง';
            }
          }
        </script>
    
        <#if isAppInitiatedAction??>
          <script>
            (function () {
              var cookieName = 'poc_password_aia_state';
    
              function cookieSuffix() {
                var suffix = '; Path=/; SameSite=Lax';
                var host = window.location.hostname;
                if (window.location.protocol === 'https:') suffix += '; Secure';
                if (host === 'pfas.pattaya.go.th' || host.endsWith('.pfas.pattaya.go.th')) {
                  suffix += '; Domain=.pfas.pattaya.go.th';
                }
                return suffix;
              }
    
              function setAiaState(value) {
                document.cookie = cookieName + '=' + encodeURIComponent(value) + cookieSuffix();
              }
    
              function clearAiaState() {
                document.cookie = cookieName + '=; Max-Age=0' + cookieSuffix();
              }
    
              <#if message?has_content && (message.type!'') == 'error'>
                setAiaState('error');
              <#else>
                clearAiaState();
              </#if>
    
              var form = document.getElementById('kc-passwd-update-form');
              if (form) {
                form.addEventListener('submit', function (event) {
                  var submitter = event.submitter;
                  if (submitter && submitter.name === 'cancel-aia') {
                    setAiaState('cancelled');
                  } else {
                    setAiaState('submitted');
                  }
                });
              }
            })();
          </script>
        </#if>
    </@verify.page>
  login__login-verify-email.ftl: |-
    <#import "verify-layout.ftl" as verify>
    <#import "app-links.ftl" as app>
    <@verify.page title="ยืนยันอีเมลของคุณ">
        <#assign targetEmail = (verifyEmail!user.email)!"">
    
        <#if verifyEmail??>
            <p class="poc-verify-copy">
                เราได้ส่งอีเมลสำหรับยืนยันไปยัง <strong>${verifyEmail}</strong> แล้ว กรุณาตรวจสอบกล่องจดหมายและกดลิงก์ยืนยันในอีเมล
            </p>
        <#else>
            <p class="poc-verify-copy">
                ระบบจะส่งอีเมลสำหรับยืนยันไปยัง <strong>${targetEmail}</strong> กรุณากดปุ่มด้านล่างเพื่อดำเนินการ
            </p>
        </#if>
    
        <#if isAppInitiatedAction??>
            <form id="kc-verify-email-form" action="${url.loginAction}" method="post">
                <div class="poc-verify-actions">
                    <#if verifyEmail??>
                        <button id="poc-verify-send" class="poc-verify-button poc-verify-button-primary" type="submit">
                            ส่งอีเมลยืนยันอีกครั้ง
                        </button>
                    <#else>
                        <button id="poc-verify-send" class="poc-verify-button poc-verify-button-primary" type="submit">
                            ส่งอีเมลยืนยัน
                        </button>
                    </#if>
                    <#if (client.baseUrl)?has_content>
                        <a id="poc-change-email" class="poc-verify-button poc-verify-button-secondary" href="${app.appUpdateEmailUrl()}">
                            เปลี่ยนอีเมล
                        </a>
                    </#if>
                    <button id="poc-verify-cancel" class="poc-verify-button poc-verify-button-secondary" type="submit" name="cancel-aia" value="true" formnovalidate>
                        ยกเลิก
                    </button>
                </div>
            </form>
        <#else>
            <p class="poc-verify-copy poc-verify-copy-secondary">
                ยังไม่ได้รับอีเมลยืนยัน?
            </p>
            <div class="poc-verify-actions">
                <a id="poc-verify-resend" class="poc-verify-button poc-verify-button-primary" href="${url.loginAction}">
                    ส่งอีเมลยืนยันอีกครั้ง
                </a>
                <#if (client.baseUrl)?has_content>
                    <a id="poc-change-email" class="poc-verify-button poc-verify-button-secondary" href="${app.appUpdateEmailUrl()}">
                        เปลี่ยนอีเมล
                    </a>
                </#if>
            </div>
        </#if>
    </@verify.page>
