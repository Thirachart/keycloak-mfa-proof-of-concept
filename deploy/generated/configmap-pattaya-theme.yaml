    เรียน คุณ${displayName}<br />
    เราได้รับคำขอให้ตั้งรหัสผ่านใหม่สำหรับบัญชีระบบการเงินและบัญชีเมืองพัทยา (PFAS) ของท่าน กรุณากดปุ่มด้านล่างเพื่อกำหนดรหัสผ่านใหม่
