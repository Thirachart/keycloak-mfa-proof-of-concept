_format_version: "3.0"
_transform: true

services:
  - name: poc-signed-out
    url: http://frontend/signed-out.html
    routes:
      - name: poc-signed-out-route
        paths:
          - /signed-out
        strip_path: true

  - name: poc-app
    url: http://oauth2-proxy:4180
    routes:
      - name: poc-app-route
        paths:
          - /
        strip_path: false
        preserve_host: true
